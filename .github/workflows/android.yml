name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qr-vision-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QR-Vision.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Vision
          path: QR-Vision.apk
          if-no-files-found: error
          retention-days: 30
