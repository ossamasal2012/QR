name: Publish QR Vision Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (example: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare optional signing key
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qrvision-release.jks"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "kind=Release-signed" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "kind=Debug-signed (testing only)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Build selected variant
        shell: bash
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/qrvision-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$VARIANT" == "release" ]]; then
            gradle --no-daemon assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk QR-Vision.apk
          else
            gradle --no-daemon assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk QR-Vision.apk
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: QR Vision ${{ inputs.tag }}
          body: |
            Automated QR Vision Android build.
            APK variant: ${{ steps.signing.outputs.kind }}.
            If this is a Debug-signed APK, use it for testing only; configure all four Android signing secrets for a distributable release build.
          files: QR-Vision.apk
          generate_release_notes: true
